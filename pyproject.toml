[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerodrop"
version = "1.1.1"
description = "Partage de fichiers et dossiers ultra rapide en réseau local"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "aiofiles>=23.2",
    "qrcode>=7.4",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]

[project.scripts]
aerodrop = "aerodrop.cli:main"
aerodrop-desktop = "aerodrop.cli:desktop_main"

[tool.setuptools.packages.find]
include = ["aerodrop*"]

[tool.setuptools.package-data]
aerodrop = ["static/*", "static/css/*", "static/js/*"]
